name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:  # job level: top level stays contents: read
      contents: read
      actions: read  # read-only run history for the dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }  # tags + history for the dashboard
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Template checks (docs index fresh, hooks, metrics)
        run: bash scripts/check.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - name: Browser for the smoke test (not a project dependency; local sessions use a preinstalled one)
        run: npm install --no-save --no-audit --no-fund playwright && npx playwright install --with-deps chromium
      - name: Project tests (once factory.json commands.test is set)
        run: |
          if python3 -c 'import json,sys; sys.exit(0 if json.load(open("factory.json"))["commands"]["test"] else 1)'; then
            python3 scripts/metrics.py test
          else
            echo "commands.test not set yet; skipping"
          fi
      - name: Refresh CI history (best effort, read-only GitHub API call)
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_runs.py --pages 2
      - name: Build dashboard
        if: always()
        run: |
          python3 scripts/dashboard.py
          cat dashboard/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload dashboard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard
          path: dashboard/
          retention-days: 30

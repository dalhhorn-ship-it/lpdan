<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1336" width="400" height="1336" role="img" aria-labelledby="t"><title id="t">How danfactory builds with agents, safely</title><style>.t{fill:#FFFFFF;font:700 17px Archivo,Arial,sans-serif}.b{fill:#B9B9DC;font:14px Archivo,Arial,sans-serif}.l{fill:#B9B9DC;font:italic 13px Archivo,Arial,sans-serif}rect{fill:#17174A;stroke-width:2}.h rect{fill:#E6007E;stroke:#E6007E}.h .t{fill:#FFFFFF}.tw>rect{stroke:#9B7BFF}.fi>rect{stroke:#2EE6F5}.fx>rect{stroke:#3D2CE0;stroke-width:3}.tw .st{fill:url(#hl)}.fi .st{fill:url(#hc)}.fx .st{fill:url(#hv)}.rv rect,.sg rect,.rl rect{stroke:#2C2C66}.rl rect{stroke:#2EE6F5;stroke-dasharray:6 4}.gt rect{fill:#0B0B2E;stroke:#F5C400;stroke-width:3}.ch rect{fill:#17174A;stroke:#F5C400;stroke-width:1.5}.ch text{fill:#FFFFFF;font:13px Archivo,Arial,sans-serif}.ar{stroke:#2EE6F5;stroke-width:2.5;fill:none}.d{stroke-dasharray:5 4}.tp{fill:#2EE6F5}.ic{stroke:#FFFFFF;stroke-width:2;fill:none}.icf{fill:none;stroke:#F5C400;stroke-width:2}.fo{fill:#4A0F3F;stroke:#E6007E;stroke-width:2}.ff{fill:#17174A;stroke:#2EE6F5;stroke-width:2}.bd{fill:#0B0B2E;stroke:#B9B9DC;stroke-width:1.5;stroke-dasharray:8 5}</style><defs><pattern id="hl" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#17174A" stroke="none"/><path d="M0 0V6" stroke="#9B7BFF" stroke-width="3"/></pattern><pattern id="hc" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#17174A" stroke="none"/><path d="M0 0V6" stroke="#2EE6F5" stroke-width="3"/></pattern><pattern id="hv" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#17174A" stroke="none"/><path d="M0 0V6" stroke="#3D2CE0" stroke-width="3"/></pattern></defs><rect width="400" height="1336" fill="#0B0B2E" stroke="none"/><g class="h"><rect x="40" y="6" width="296" height="52"/><path class="ic" d="M54 21.0h16l6 6v16h-22Z"/><path class="ic" d="M59 33.0l4 4 8-9"/><text class="t" x="86" y="38">You approve the PRD</text></g><path class="ar" d="M188 60V86"/><path class="tp" d="M182 84H194L188 92Z"/><text class="l" x="200" y="81">locked criteria</text><g class="tw"><rect x="40" y="94" width="296" height="104"/><rect class="st" x="40" y="94" width="10" height="104"/><text class="t" x="62" y="120">Test writers</text><text class="b" x="62" y="142">Write acceptance tests from the PRD.</text><text class="b" x="62" y="161">Admitted only if they fail first and</text><text class="b" x="62" y="180">pass on a second implementation.</text></g><path class="ar" d="M188 200V226"/><path class="tp" d="M182 224H194L188 232Z"/><text class="l" x="200" y="221">admitted tests</text><g class="fi"><rect x="40" y="234" width="296" height="84"/><rect class="st" x="40" y="234" width="10" height="84"/><text class="t" x="62" y="260">Issue finders</text><text class="b" x="62" y="282">Replay the tests, file one issue</text><text class="b" x="62" y="301">per root cause.</text></g><path class="ar" d="M188 320V346"/><path class="tp" d="M182 344H194L188 352Z"/><text class="l" x="200" y="341">one issue each</text><g class="fx"><rect x="40" y="354" width="296" height="104"/><rect class="st" x="40" y="354" width="10" height="104"/><text class="t" x="62" y="380">Fixers</text><text class="b" x="62" y="402">One sandboxed agent per attempt, no</text><text class="b" x="62" y="421">network. Max 3 attempts per issue,</text><text class="b" x="62" y="440">5 USD a day, 2 USD a run.</text></g><path class="ar" d="M188 460V486"/><path class="tp" d="M182 484H194L188 492Z"/><text class="l" x="200" y="481">fix</text><g class="rv"><rect x="40" y="494" width="296" height="48"/><text class="t" x="54" y="524">Independent reviewer (read-only)</text></g><path class="ar" d="M188 544V570"/><path class="tp" d="M182 568H194L188 576Z"/><text class="l" x="200" y="565">verdict</text><g class="gt"><rect x="40" y="578" width="296" height="150"/><text class="t" x="54" y="606">Merge gate</text></g><g class="ch"><rect x="54" y="622" width="82" height="26"/><text x="62" y="640">structure</text></g><g class="ch"><rect x="142" y="622" width="53" height="26"/><text x="150" y="640">build</text></g><g class="ch"><rect x="201" y="622" width="45" height="26"/><text x="209" y="640">lint</text></g><g class="ch"><rect x="252" y="622" width="53" height="26"/><text x="260" y="640">tests</text></g><g class="ch"><rect x="54" y="654" width="75" height="26"/><text x="62" y="672">coverage</text></g><g class="ch"><rect x="135" y="654" width="90" height="26"/><text x="143" y="672">acceptance</text></g><g class="ch"><rect x="231" y="654" width="82" height="26"/><text x="239" y="672">protected</text></g><g class="ch"><rect x="54" y="686" width="38" height="26"/><text x="62" y="704">PRD</text></g><g class="ch"><rect x="98" y="686" width="60" height="26"/><text x="106" y="704">review</text></g><g class="ch"><rect x="164" y="686" width="75" height="26"/><text x="172" y="704">security</text></g><g class="ch"><rect x="245" y="686" width="45" height="26"/><text x="253" y="704">size</text></g><path class="ar" d="M188 730V756"/><path class="tp" d="M182 754H194L188 762Z"/><text class="l" x="200" y="751">pass</text><g class="sg"><rect x="40" y="764" width="296" height="48"/><text class="t" x="54" y="794">staging branch (fixes stack up)</text></g><path class="ar" d="M188 814V840"/><path class="tp" d="M182 838H194L188 846Z"/><g class="rl"><rect x="40" y="848" width="296" height="66"/><text class="t" x="54" y="874">Release train</text><text class="b" x="54" y="896">Re-verify staging as a batch.</text></g><path class="ar" d="M188 916V942"/><path class="tp" d="M182 940H194L188 948Z"/><g class="rl"><rect x="40" y="950" width="296" height="48"/><text class="t" x="54" y="980">Release report (exact commands)</text></g><path class="ar" d="M188 1000V1026"/><path class="tp" d="M182 1024H194L188 1032Z"/><g class="h"><rect x="40" y="1034" width="296" height="52"/><text class="t" x="54" y="1066">You push to main</text></g><path class="ar" d="M188 1088V1114"/><path class="tp" d="M182 1112H194L188 1120Z"/><g class="rl"><rect x="40" y="1122" width="296" height="48"/><text class="t" x="54" y="1152">Deploy</text></g><path class="ar" d="M336 653H354V406H346"/><path class="tp" d="M348 400V412L339 406Z"/><text class="l" transform="translate(367 529) rotate(-90)" text-anchor="middle">rejected: reasons, rework</text><path class="ar d" d="M336 1146H386V276H346"/><path class="tp" d="M348 270V282L339 276Z"/><text class="l" transform="translate(380 937) rotate(-90)" text-anchor="middle">failed smoke: revert branch + new issue</text><rect class="bd" x="12" y="1198" width="352" height="132"/><text class="t" x="40" y="1226">Shared repository</text><rect class="icf" x="40" y="1249" width="18" height="13"/><path class="ic" d="M44 1249v-4a5 5 0 0 1 10 0v4"/><text class="b" x="72" y="1257">acceptance tests (locked)</text><path class="fo" d="M40 1272h8l3 3h11v15h-22Z"/><path class="ff" d="M66 1272h8l3 3h11v15h-22Z"/><text class="b" x="100" y="1285">issues/open · issues/fixed</text><circle class="ic" cx="51" cy="1307" r="7"/><path class="ic" d="M51 1300l0 -4M51 1314l0 4M44 1307l-4 0M58 1307l4 0M56 1312l3 3M46 1302l-3 -3M56 1302l3 -3M46 1312l-3 3"/><text class="b" x="72" y="1313">rules &amp; evals</text><path class="ar" d="M40 708H24V1192"/><path class="tp" d="M18 1190H30L24 1198Z"/><text class="l" transform="translate(18 963) rotate(-90)" text-anchor="middle">candidate rules</text><path class="ar" d="M12 1307H10V146H30"/><path class="tp" d="M28 140V152L37 146Z"/><text class="l" transform="translate(24 336) rotate(-90)" text-anchor="middle">learning loop</text></svg>
